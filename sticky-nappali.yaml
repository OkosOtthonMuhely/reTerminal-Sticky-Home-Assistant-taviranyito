          it.image(165, 250, id(wb_partly), INK, PAPER);
          it.print(W / 2, 430, id(f_head), INK, TextAlign::TOP_CENTER, "Időjárás betöltése...");
          it.print(W / 2, 480, id(f_small), INK, TextAlign::TOP_CENTER, "Home Assistant: ${weather_entity}");
        } else {
        // ---- ma ----
        it.image(24, 78, icon(kind(cnow), true), INK, PAPER);
        it.printf(462, 70, id(f_big), INK, TextAlign::TOP_RIGHT, "%d°", num(0, 1));
        it.print(W / 2, 250, id(f_head), INK, TextAlign::TOP_CENTER, hu(cnow));
        it.printf(W / 2, 300, id(f_body), INK, TextAlign::TOP_CENTER, "max %d°   /   min %d°", num(0, 2), num(0, 3));

        // ---- részletek ----
        const char *dl[3] = {"Csapadék", "Szél", "Pára"};
        std::string dv[3];
        dv[0] = precip(0, 4, 5);
        { char b[16]; snprintf(b, sizeof(b), "%d km/h", num(0, 6)); dv[1] = b; }
        { char b[16]; snprintf(b, sizeof(b), "%d%%", num(0, 7)); dv[2] = b; }
        for (int i = 0; i < 3; i++) {
          int x = 14 + i * 156;
          thick_box(x, 350, 140, 76, 3);
          it.print(x + 70, 358, id(f_small), INK, TextAlign::TOP_CENTER, dl[i]);
          it.print(x + 70, 384, id(f_tile), INK, TextAlign::TOP_CENTER, dv[i].c_str());
        }

        // ---- következő 3 nap (az esős / viharos / havas nap sötét) ----
        it.print(14, 446, id(f_state), INK, TextAlign::TOP_LEFT, "KÖVETKEZŐ NAPOK");
        it.filled_rectangle(14, 476, W - 28, 2, INK);
        for (int i = 0; i < 3; i++) {
          size_t r = i + 1;
          int x = 14 + i * 156, y = 490;
          if (r >= wx.size()) { thick_box(x, y, 140, 222, 3); continue; }
          int k = kind(fld(r, 1));
          bool wet = k >= 5 && k <= 8;
          Color fg = wet ? PAPER : INK, bg = wet ? INK : PAPER;
          if (wet) it.filled_rectangle(x, y, 140, 222, INK);
          else     thick_box(x, y, 140, 222, 3);
          it.print(x + 70, y + 14, id(f_state), fg, TextAlign::TOP_CENTER, fld(r, 0).c_str());
          it.image(x + 34, y + 50, icon(k, false), fg, bg);
          char t[24];
          snprintf(t, sizeof(t), "%d° / %d°", num(r, 2), num(r, 3));
          it.print(x + 70, y + 140, strlen(t) > 9 ? id(f_state) : id(f_tile), fg, TextAlign::TOP_CENTER, t);
          it.print(x + 70, y + 184, id(f_small), fg, TextAlign::TOP_CENTER, precip(r, 4, 5).c_str());
        }

        // ---- lábléc: benti adatok (a Sticky saját érzékelője) + a rajzolás ideje ----
        it.filled_rectangle(14, 730, W - 28, 2, INK);
        if (id(temp_sensor).has_state()) {
          char b[40];
          snprintf(b, sizeof(b), "Bent: %.1f °C   %.0f%%", id(temp_sensor).state,
                   id(hum_sensor).has_state() ? id(hum_sensor).state : 0.0f);
          for (char *q = b; *q; q++) if (*q == '.') *q = ',';
          it.print(14, 748, id(f_body), INK, TextAlign::TOP_LEFT, b);
        }
        auto tn = id(rtc_time).now();
        if (tn.is_valid())
          it.strftime(466, 754, id(f_small), INK, TextAlign::TOP_RIGHT, "frissítve %H:%M", tn);
        }   // van adat
      }
      // =================== ASSZISZTENS: VÁLASZ ===============
      else {
        // amit kérdeztél: sötét sáv a teljes szélességben
        auto q = wrap(id(last_heard), 30);
        if (q.size() > 2) q.resize(2);
        int qh = 16 + (int) q.size() * 27 + 13;
        it.filled_rectangle(0, 58, W, qh, INK);
        for (size_t i = 0; i < q.size(); i++) {
          it.print(W / 2, 58 + 14 + (int) i * 27, id(f_body), PAPER,
                   TextAlign::TOP_CENTER, q[i].c_str());
        }
        // a válasz, optikailag középre igazítva
        std::string rtext = id(last_reply).empty() ? std::string("(nincs válasz)")
                                                   : id(last_reply);
        auto r = wrap(rtext, 24);
        const int LH = 42;
        int top   = 58 + qh;
        int avail = 646 - top;
        int blockh = (int) r.size() * LH;
        int ry = top + (avail - blockh) / 2;
        if (ry < top + 12) ry = top + 12;
        for (size_t i = 0; i < r.size(); i++) {
          it.print(W / 2, ry + (int) i * LH, id(f_reply), INK,
                   TextAlign::TOP_CENTER, r[i].c_str());
        }
        // VISSZA: teljes szélességben. A helye egyezzen a touchscreen zónával.
        it.filled_rectangle(12, 660, 456, 92, INK);
        it.image(157, 686, id(ic_back), PAPER, INK);
        it.print(213, 684, id(f_head), PAPER, TextAlign::TOP_LEFT, "VISSZA");
      }

# Rendszeres frissítés ébren (csak low_power: "false" mellett számít igazán).
interval:
  - interval: 10min
    then:
      - script.execute: redraw

# gombok a Home Assistantban
button:
  - platform: template
    name: "Kijelző frissítése"
    on_press:
      - script.execute: redraw
  - platform: template
    name: "Asszisztens indítása"
    on_press:
      - voice_assistant.start:
  - platform: restart
    name: "Újraindítás"
    entity_category: config

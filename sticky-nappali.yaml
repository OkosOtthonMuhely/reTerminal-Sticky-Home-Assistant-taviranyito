# PDM mikrofon: bal csatorna, 16 bit, DC eltolás-javítással.
microphone:
  - platform: i2s_audio
    id: onboard_mic
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO20
    channel: left
    bits_per_sample: 16bit
    sample_rate: 16000
    correct_dc_offset: true

voice_assistant:
  microphone: onboard_mic
  use_wake_word: false
  # ha halkan hall, ezekkel lehet kísérletezni:
  # volume_multiplier: 2.0
  # auto_gain: 31dBFS
  # noise_suppression_level: 2
  on_listening:
    - logger.log:
        level: WARN
        format: "asszisztens: figyel"
  on_stt_end:
    - lambda: |-
        id(last_heard) = x;
        id(ui_mode) = 2;
    - logger.log:
        level: WARN
        format: "asszisztens hallotta: '%s'"
        args: ['x.c_str()']
  on_tts_start:
    - lambda: |-
        id(last_reply) = x;
        if (id(last_heard).empty()) id(last_heard) = "(nem hallottam semmit)";
        id(ui_mode) = 3;
    - script.execute: beep
    - script.execute: redraw
    - script.execute: back_to_menu
  on_end:
    - if:
        condition:
          lambda: 'return id(ui_mode) != 3;'
        then:
          - lambda: 'id(ui_mode) = 0;'
          - script.execute: redraw
  on_error:
    - lambda: |-
        id(last_reply) = std::string("Hiba – ") + message;
        id(ui_mode) = 3;
    - script.execute: redraw
    - script.execute: back_to_menu

# =============================================================================
#  ÉRINTÉS – minden oldal koppintási zónái egy helyen. A zónák számát (t) a lenti
#  műveletek kapják meg. A koordináták a rajzolással (display) egyeznek: ha egy
#  oldalon átrendezed a gombokat, itt is igazítsd hozzá.
# =============================================================================
touchscreen:
  - platform: gt911
    i2c_id: i2c_touch
    id: sticky_touch
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    display: eink
    # Nincs transform – a tengelyeket az „Érintés tükrözés X/Y” kapcsolók javítják.
    on_touch:
      - lambda: |-
          int rx = touch.x, ry = touch.y;
          int x = rx, y = ry;
          if (id(flip_x).state) x = 479 - x;
          if (id(flip_y).state) y = 799 - y;
          //  0–3 csempék   4 asszisztens / megszakítás   5 vissza   6 időjárás   7 fűtés sáv
          //  10 TV be/ki  11 extra  16 forrás 1  12 forrás 2  13 forrás 3  14 halkít  15 hangosít
          //  20 lámpa be/ki  21 fényerő sáv  22 színhő sáv
          //  110 / 111 fűtés -/+   112–114 ki / fűtés / auto   115–117 gyors beállítások
          int t = -1;
          if (id(ui_mode) == 0) {
            // menü
            if      (y >=  64 && y <= 244) t = (x < 240) ? 0 : 1;
            else if (y >= 256 && y <= 436) t = (x < 240) ? 2 : 3;
            else if (y >= 448 && y <= 528) t = 7;
            else if (y >= 542 && y <= 722) t = (x < 240) ? 4 : 6;
          } else if (id(ui_mode) == 1 || id(ui_mode) == 2) {
            t = 4;                                  // asszisztens: bárhol megszakítja
          } else if (id(ui_mode) == 3) {
            if (x >= 12 && x <= 468 && y >= 660 && y <= 752) t = 5;
          } else if (id(ui_mode) == 5) {
            // TV távirányító
            int col = (x < 240) ? 0 : 1;
            if      (y >=  72 && y <= 252) t = (x < 162) ? 10 : (x < 317) ? 11 : 16;
            else if (y >= 264 && y <= 444) t = 12 + col;
            else if (y >= 456 && y <= 636) t = 14 + col;
            else if (y >= 660 && y <= 752) t = 5;
          } else if (id(ui_mode) == 6) {
            // lámpa oldal
            if      (y >=  72 && y <= 252) t = 20;
            else if (y >= 300 && y <= 420) t = 21;
            else if (y >= 460 && y <= 580) t = 22;
            else if (y >= 660 && y <= 752) t = 5;
          } else if (id(ui_mode) == 14) {
            t = 5;                                  // időjárás: bárhová koppintva vissza a menübe
          } else if (id(ui_mode) == 15) {
            // fűtés:  -  cél  +   /   ki  fűtés  auto   /   3 gyors beállítás
            if      (y >= 186 && y <= 306) t = (x < 146) ? 110 : (x > 334) ? 111 : -1;
            else if (y >= 320 && y <= 386) t = (x < 164) ? 112 : (x < 316) ? 113 : 114;
            else if (y >= 400 && y <= 472) t = (x < 162) ? 115 : (x < 318) ? 116 : 117;
          }
          id(touch_x) = x;
          id(hit_tile) = t;
          ESP_LOGD("touch", "nyers=%d,%d  javított=%d,%d  oldal=%d  zóna=%d",
                   rx, ry, x, y, id(ui_mode), t);
      - lambda: 'id(awake_ms) = ${awake_after_button_ms};'
      - script.execute: idle_timer
      # menü csempék: elindul a hosszú nyomás figyelése. A rövid érintést az
      # on_release kezeli (be/ki), a hosszú nyomás a részletes oldalt nyitja.
      - if:
          condition:
            lambda: 'return id(ui_mode) == 0 && id(hit_tile) >= 0 && id(hit_tile) <= 3;'
          then:
            - script.execute: long_press
      # asszisztens indítása / megszakítása
      - if:
          condition:
            lambda: 'return id(hit_tile) == 4;'
          then:
            - if:
                condition:
                  lambda: 'return id(ui_mode) == 0;'
                then:
                  - script.execute: start_voice
                else:
                  - script.execute: beep
                  - voice_assistant.stop:
                  - script.stop: back_to_menu
                  - lambda: 'id(ui_mode) = 0;'
                  - script.execute: redraw
      # VISSZA
      - if:
          condition:
            lambda: 'return id(hit_tile) == 5;'
          then:
            - script.execute: go_back
      # fűtés sáv a menüben → fűtés oldal
      - if:
          condition:
            lambda: 'return id(hit_tile) == 7 && id(ui_mode) == 0;'
          then:
            - script.execute: beep
            - lambda: 'id(ui_mode) = 15;'
            - script.execute: redraw
      # a fűtés oldal gombjai
      - if:
          condition:
            lambda: 'return id(ui_mode) == 15 && id(hit_tile) >= 110 && id(hit_tile) <= 117;'
          then:
            - script.execute:
                id: heat_touch
                t: !lambda 'return id(hit_tile);'
      # jobb alsó csempe → időjárás oldal (a TV távirányító: a 4. csempe hosszan)
      - if:
          condition:
            lambda: 'return id(hit_tile) == 6 && id(ui_mode) == 0;'
          then:
            - script.execute: beep
            - lambda: 'id(ui_mode) = 14;'
            - script.execute: redraw
      # TV távirányító gombjai
      - if:
          condition:
            lambda: 'return id(ui_mode) == 5 && id(hit_tile) >= 10 && id(hit_tile) <= 16;'
          then:
            - script.execute:
                id: tv_action
                idx: !lambda 'return id(hit_tile);'
      # lámpa oldal: be/ki
      - if:
          condition:
            lambda: 'return id(ui_mode) == 6 && id(hit_tile) == 20;'
          then:
            - script.execute:
                id: do_toggle
                idx: !lambda 'return id(light_page);'
      # lámpa oldal: fényerő / színhő sáv
      - if:
          condition:
            lambda: 'return id(ui_mode) == 6 && (id(hit_tile) == 21 || id(hit_tile) == 22);'
          then:
            - script.execute:
                id: light_set
                kind: !lambda 'return id(hit_tile) - 21;'
    # Ha az ujjad a hosszú nyomás ideje előtt felemeled = rövid érintés = be/ki.
    on_release:
      - if:
          condition:
            script.is_running: long_press
          then:
            - script.stop: long_press
            - script.execute:
                id: do_toggle
                idx: !lambda 'return id(hit_tile);'

# a csempék állapota a Home Assistantból (ettől lesz sötét a bekapcsolt csempe)
binary_sensor:
  - platform: homeassistant
    id: st_tile1
    entity_id: ${tile1_entity}
    on_state:
      - script.execute: redraw
  - platform: homeassistant
    id: st_tile2
    entity_id: ${tile2_entity}
    on_state:
      - script.execute: redraw
  - platform: homeassistant
    id: st_tile3
    entity_id: ${tile3_entity}
    on_state:
      - script.execute: redraw
  - platform: homeassistant
    id: st_tile4
    entity_id: ${tile4_entity}
    on_state:
      - script.execute: redraw
  # a TV távirányító oldal állapotai
  - platform: homeassistant
    id: st_tv_power
    entity_id: ${tv_power_entity}
    on_state:
      - script.execute: redraw
  - platform: homeassistant
    id: st_tv_extra
    entity_id: ${tv_extra_entity}
    on_state:
      - if:
          condition:
            lambda: 'return id(ui_mode) == 5;'
          then:
            - script.execute: redraw
  # ---- fizikai gombok (ezek ébresztik fel mély alvásból is) ----
  # Hogy melyik oldalon mit csinálnak, azt a btn_updown / btn_ok_short script dönti el.
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: btn_up
    name: "Gomb FEL"
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: 'id(awake_ms) = ${awake_after_button_ms};'
      - script.execute: idle_timer
      - script.execute:
          id: btn_updown
          dir: -1
  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: btn_down
    name: "Gomb LE"
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: 'id(awake_ms) = ${awake_after_button_ms};'
      - script.execute: idle_timer
      - script.execute:
          id: btn_updown
          dir: 1
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: btn_ok
    name: "Gomb OK"
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: 'id(awake_ms) = ${awake_after_button_ms};'
      - script.execute: idle_timer
    on_click:
      # rövid nyomás: oldaltól függ
      - min_length: 10ms
        max_length: 700ms
        then:
          - script.execute: btn_ok_short

text_sensor:
  # ---- fűtés: mód (off / heat / auto), és hogy éppen fűt-e ----

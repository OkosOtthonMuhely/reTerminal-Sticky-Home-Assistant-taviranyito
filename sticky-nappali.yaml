        std::vector<std::vector<std::string>> wx;
        {
          std::string src = id(st_weather).state;
          size_t a = 0;
          while (a <= src.size()) {
            size_t b = src.find(';', a);
            if (b == std::string::npos) b = src.size();
            std::string part = src.substr(a, b - a);
            std::vector<std::string> f;
            size_t c = 0;
            while (c <= part.size()) {
              size_t d = part.find('|', c);
              if (d == std::string::npos) d = part.size();
              f.push_back(part.substr(c, d - c));
              c = d + 1;
            }
            wx.push_back(f);
            a = b + 1;
          }
        }
        auto fld = [&](size_t r, size_t k) -> std::string {
          return (r < wx.size() && k < wx[r].size()) ? wx[r][k] : std::string("");
        };
        auto num = [&](size_t r, size_t k) -> int { std::string v = fld(r, k); return v.empty() ? 0 : atoi(v.c_str()); };
        auto kind = [](const std::string &c) -> int {
          if (c == "sunny") return 0;
          if (c == "clear-night") return 1;
          if (c == "partlycloudy") return 2;
          if (c == "cloudy") return 3;
          if (c == "fog") return 4;
          if (c == "rainy") return 5;
          if (c == "pouring") return 6;
          if (c == "lightning" || c == "lightning-rainy") return 7;
          if (c == "snowy" || c == "snowy-rainy" || c == "hail") return 8;
          if (c == "windy" || c == "windy-variant") return 9;
          return 10;
        };
        auto hu = [](const std::string &c) -> const char * {
          if (c == "sunny") return "Napos";
          if (c == "clear-night") return "Tiszta éjszaka";
          if (c == "partlycloudy") return "Részben felhős";
          if (c == "cloudy") return "Felhős";
          if (c == "fog") return "Köd";
          if (c == "rainy") return "Esős";
          if (c == "pouring") return "Felhőszakadás";
          if (c == "lightning") return "Zivatar";
          if (c == "lightning-rainy") return "Zivatar, eső";
          if (c == "snowy") return "Havazás";
          if (c == "snowy-rainy") return "Havas eső";
          if (c == "hail") return "Jégeső";
          if (c == "windy" || c == "windy-variant") return "Szeles";
          return "Változó";
        };
        auto icon = [&](int k, bool big) -> esphome::image::Image * {
          switch (k) {
            case 0:  return big ? id(wb_sunny)   : id(ws_sunny);
            case 1:  return big ? id(wb_night)   : id(ws_night);
            case 2:  return big ? id(wb_partly)  : id(ws_partly);
            case 3:  return big ? id(wb_cloudy)  : id(ws_cloudy);
            case 4:  return big ? id(wb_fog)     : id(ws_fog);
            case 5:  return big ? id(wb_rainy)   : id(ws_rainy);
            case 6:  return big ? id(wb_pouring) : id(ws_pouring);
            case 7:  return big ? id(wb_storm)   : id(ws_storm);
            case 8:  return big ? id(wb_snowy)   : id(ws_snowy);

sensor:
  # ---- fűtés: a radiátorfej saját mérése és a célhőmérséklet ----
  - platform: homeassistant
    id: heat_cur
    entity_id: ${heat_entity}
    attribute: current_temperature
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(ui_mode) == 0 || id(ui_mode) == 15;'
          then:
            - script.execute: redraw
  - platform: homeassistant
    id: heat_target
    entity_id: ${heat_entity}
    attribute: temperature
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(ui_mode) == 0 || id(ui_mode) == 15;'
          then:
            - script.execute: redraw
  - platform: sht4x
    i2c_id: i2c_sensor
    address: 0x44
    temperature:
      name: "Hőmérséklet"
      id: temp_sensor
    humidity:
      name: "Páratartalom"
      id: hum_sensor
    update_interval: 120s
  - platform: template
    id: battery_level
    name: "Akkumulátor"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 120s
    lambda: |-
      // BQ27220 töltöttségi szint (StateOfCharge), 0x2C parancs.
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        ESP_LOGW("battery", "BQ27220 SoC read failed, i2c error=%d", (int) err);
        return NAN;
      }
      return static_cast<float>(static_cast<uint16_t>(raw[0]) |
                               (static_cast<uint16_t>(raw[1]) << 8));
  - platform: template
    id: battery_voltage
    name: "Akkumulátor feszültség"
    unit_of_measurement: "mV"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 120s
    lambda: |-
      uint8_t reg = 0x08;                      // feszültség (Voltage)
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) return NAN;
      return static_cast<float>(static_cast<uint16_t>(raw[0]) |
                               (static_cast<uint16_t>(raw[1]) << 8));
  - platform: template
    id: battery_current
    name: "Akkumulátor áram"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 120s
    lambda: |-
      uint8_t reg = 0x0C;                      // átlagos áram (AverageCurrent), előjeles
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) return NAN;
      uint16_t v = static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8);
      return static_cast<float>(static_cast<int16_t>(v));   // pozitív = tölt
  # ---- 1. lámpa (1. csempe) adatai a lámpa oldalhoz ----
  - platform: homeassistant
    id: l1_bri
    entity_id: ${tile1_entity}
    attribute: brightness

          char buf[16];
          if (pp >= 0) { snprintf(buf, sizeof(buf), "%d%%", pp); return buf; }
          std::string mm = fld(r, km);
          if (mm.empty() || atof(mm.c_str()) <= 0.05f) return "0 mm";
          for (auto &ch : mm) if (ch == '.') ch = ',';
          return mm + " mm";
        };

        // ---- még nincs adat (épp felébredt, a Home Assistant még nem kapcsolódott) ----
        std::string cnow = fld(0, 0);

# =============================================================================
#  reTerminal Sticky – Home Assistant fali vezérlő (minta projekt)
#
#  E-papíros nappali vezérlő a Seeed reTerminal Sticky-re (ESP32-S3, 800×480
#  fekete-fehér kijelző, érintőképernyő, 3 gomb, mikrofon, hőmérő, akkumulátor).
#  Minden, amit a saját lakásodhoz át kell írnod, a közvetlenül alatta lévő
#  „substitutions” blokkban van. Az ikonok Material Design Icon NEVEK:
#  https://pictogrammers.com/library/mdi/   (pl. „ceiling-light”, „sofa”)
#
#  MENÜ (főképernyő)                      TV TÁVIRÁNYÍTÓ (a 4. csempe hosszan)
#  +-------------+-------------+          +--------+--------+--------+
#  |   CSEMPE 1  |   CSEMPE 2  |          | BE/KI  | EXTRA  | FORRÁS1|
#  |   (lámpa)   |   (lámpa)   |          +--------+--------+--------+
#  +-------------+-------------+          |  FORRÁS 2    |  FORRÁS 3    |
#  |   CSEMPE 3  |   CSEMPE 4  |          +--------------+--------------+
#  |   (lámpa)   | (bármilyen  |          |   HALKÍT     |  HANGOSÍT    |
#  |             |  kapcsoló)  |          +--------------+--------------+
#  +-------------+-------------+          |           VISSZA            |
#  |  FŰTÉS  21,4°  cél 22,0°  |          +-----------------------------+
#  +-------------+-------------+
#  |  HANGALAPÚ  | IDŐJÁRÁS    |          LÁMPA OLDAL (1–3. csempe hosszan)
#  |  ASSZISZTENS|  ☁  18°     |            BE/KI, fényerő sáv, színhő sáv
#  +-------------+-------------+
#
#  MŰKÖDÉS
#    Csempe:        rövid érintés = be/ki, hosszan (0,6 mp) = részletes oldal
#                   (1–3. csempe: lámpa oldal, 4. csempe: TV távirányító)
#    Fűtés sáv:     a fűtés oldal (cél ±0,5 fok, mód, gyors beállítások, 24 órás grafikon)
#                   – fűtés közben a sáv sötét
#    Bal alul:      hangalapú asszisztens (Home Assistant Assist)
#    Jobb alul:     időjárás oldal (ugyanez jelenik meg alvás közben is)
#    Gombok:        OK = asszisztens a menüben, máshol vissza a menübe
#                   FEL / LE = a menüben és a lámpa oldalakon lapozás a lámpák között,
#                   a TV oldalon hangerő, a fűtés oldalon ±0,5 fok
#    Alvás:         ha nincs használatban, mély alvásba megy (a kijelző tartja a képet),
#                   bármelyik gombra felébred, és magától is 4 óránként frissít.
#
#  HOME ASSISTANT OLDAL (külön fájlok, a configuration.yaml-ba)
#    sticky_idojaras_ha.yaml        – az időjárás oldalhoz (template szenzor)
#    sticky_futes_elozmeny_ha.yaml  – a fűtés grafikonhoz (template szenzor)
#  Az ESPHome integrációban engedélyezd: „Az eszköz Home Assistant műveleteket
#  hajthat végre” – enélkül a gombok nem tudnak lámpát kapcsolni.
#
#  A secrets.yaml-ban kell: wifi_ssid, wifi_password, ota_password, api_encryption_key
# =============================================================================
substitutions:
  # ---------------------------------------------------------------------------
  #  >>>>>>>>>>>>>>>>>>>>>>  INNEN SZERKESZD  <<<<<<<<<<<<<<<<<<<<<<
  # ---------------------------------------------------------------------------
  device_name: sticky-nappali             # az ESPHome eszköz neve (kisbetű, kötőjel)
  friendly_name: "Sticky Nappali"         # így látszik a Home Assistantban
  # ---- CSEMPE 1 (bal felül) – lámpa: hosszan nyomva fényerő / színhő oldal ----
  tile1_entity: light.nappali_mennyezeti
  tile1_label: "Mennyezeti"
  tile1_icon: ceiling-light
  # ---- CSEMPE 2 (jobb felül) – lámpa ----------------------------------------
  tile2_entity: light.allolampa
  tile2_label: "Állólámpa"
  tile2_icon: floor-lamp
  # ---- CSEMPE 3 (bal alul) – lámpa ------------------------------------------
  tile3_entity: light.polc_led
  tile3_label: "Polc"
  tile3_icon: led-strip-variant
  # ---- CSEMPE 4 (jobb alul) – bármi, ami be/ki kapcsolható (switch,
  #      input_boolean, light...). Hosszan nyomva a TV távirányító nyílik meg. ----
  tile4_entity: switch.tv
  tile4_label: "TV"
  tile4_icon: television
  # ---- ALSÓ SOR -------------------------------------------------------------
  voice_label: "ASSZISZTENS"              # bal alul: hangalapú asszisztens
  voice_icon: home-assistant
  weather_label: "IDŐJÁRÁS"               # jobb alul: időjárás oldal
  # ---- FŰTÉS (radiátor termosztátfej vagy bármilyen climate entitás) -------
  heat_entity: climate.nappali_radiator
  heat_label: "Fűtés"
  #  A 24 órás grafikon adatai (sticky_futes_elozmeny_ha.yaml a Home Assistantban)
  heat_history_entity: sensor.sticky_futes_elozmeny
  #  Három gyors beállítás a fűtés oldalon (név + hőmérséklet)
  heat_preset1_label: "Eco"
  heat_preset1: "18"
  heat_preset2_label: "Komfort"
  heat_preset2: "22"
  heat_preset3_label: "Éjszaka"
  heat_preset3: "17"
  # ---- IDŐJÁRÁS (sticky_idojaras_ha.yaml a Home Assistantban) -------------
  weather_entity: sensor.sticky_idojaras
  # ---- TV TÁVIRÁNYÍTÓ OLDAL -------------------------------------------------
  #  A hangerő és a források ennek a media playernek mennek.
  tv_media_player: media_player.tv
  #  A BE/KI gomb ezt kapcsolja (és ennek az állapotát mutatja).
  tv_power_entity: switch.tv
  #  EXTRA gomb: bármilyen be/ki kapcsolható entitás (pl. Ambilight, hangprojektor).
  tv_extra_entity: light.tv_hatterfeny
  tv_extra_label: "HÁTTÉRFÉNY"
  tv_extra_icon: television-ambient-light
  #  Három forrás / alkalmazás gomb. A „source” pontosan egyezzen a TV source_list
  #  értékeivel (Fejlesztői eszközök → Állapotok → a media player → source_list).
  tv_src1_label: "KONZOL"
  tv_src1_icon: controller
  tv_src1_source: "HDMI 2"
  tv_src2_label: "YOUTUBE"
  tv_src2_icon: youtube
  tv_src2_source: "YouTube"
  tv_src3_label: "NETFLIX"
  tv_src3_icon: netflix
  tv_src3_source: "Netflix"
  # ---- ENERGIATAKARÉKOSSÁG --------------------------------------------------
  #  "true"  – a beállított idő után elalszik, bármelyik gombra felébred.
  #  "false" – soha nem alszik (mindig friss, de kb. naponta tölteni kell).
  low_power: "true"
  awake_after_button_ms: "120000"         # 2 percig ébren marad érintés után
  awake_after_timer_ms:  "25000"          # 25 mp-ig ébren marad egy magától indult frissítéskor
  sleep_duration: 240min                  # alvás közben 4 óránként magától frissít
  # ---------------------------------------------------------------------------
  #  >>>>>>>>>>>>>>>>>>>>>>  EDDIG SZERKESZD  <<<<<<<<<<<<<<<<<<<<<<
  #  Innentől a „gépház” – átírni csak akkor kell, ha a működést változtatnád.
  # ---------------------------------------------------------------------------
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # 1000-es prioritás: minden komponens előtt (a kijelzőé 800).
    # Feloldja a mély alvás alatti lábtartásokat, és hidegindítja az e-papír panelt.
    - priority: 1000
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis((gpio_num_t) 45);
            gpio_hold_dis((gpio_num_t) 46);
            const gpio_num_t EPD_EN  = (gpio_num_t) 47;
            const gpio_num_t EPD_RST = (gpio_num_t) 17;
            gpio_hold_dis(EPD_EN);
            gpio_hold_dis(EPD_RST);
            gpio_reset_pin(EPD_EN);
            gpio_reset_pin(EPD_RST);
            gpio_set_direction(EPD_EN,  GPIO_MODE_OUTPUT);
            gpio_set_direction(EPD_RST, GPIO_MODE_OUTPUT);
            gpio_set_level(EPD_RST, 0);
            gpio_set_level(EPD_EN,  0);
            delay(150);
            gpio_set_level(EPD_EN,  1);
            delay(30);
            gpio_set_level(EPD_RST, 1);
            delay(30);
            ESP_LOGI("epd", "panel hidegindítva");
    - priority: 600
      then:
        - lambda: |-
            // Gombos ébresztés = valaki itt van, maradjon ébren. Időzített ébredés = gyors frissítés.
            auto cause = esp_sleep_get_wakeup_cause();
            bool by_button = (cause == ESP_SLEEP_WAKEUP_EXT1);
            id(awake_ms) = by_button ? ${awake_after_button_ms} : ${awake_after_timer_ms};
            ESP_LOGI("sleep", "ébredés oka=%d  ébren marad=%d ms", (int) cause, id(awake_ms));
        - deep_sleep.prevent: sleeper
        # tápfeszültség-retesz (enélkül a készülék kikapcsol), érintés, mikrofon, töltés
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        - switch.turn_on: touch_power_enable
        - output.turn_on: mic_power_enable
        - output.turn_on: charge_enable
        - pcf8563.read_time:
    - priority: -100
      then:
        # Időzített (nem gombos) ébredéskor maradjon az időjárás képernyőn –
        # a Home Assistant adata pár másodperc múlva megjön, és újrarajzolja.
        - lambda: |-
            if (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER) id(ui_mode) = 14;
        - delay: 2s
        # Két teljes frissítés ébredés után, egy teljes frissítési ciklusnál nagyobb szünettel.
        - component.update: eink
        - delay: 10s
        - component.update: eink
        - script.execute: idle_timer

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: arduino
    advanced:
      enable_idf_experimental_features: true

# A napló a CH343P USB-soros átalakítón keresztül (UART0) jön.
logger:
  hardware_uart: UART0
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT
  ap:
    ssid: "${device_name} beállítás"

captive_portal:

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14
  miso_pin: GPIO12

i2c:
  - id: i2c_sensor
    scl: GPIO0
    sda: GPIO1
    frequency: 400kHz
    # Várt címek: 0x44 (SHT40 hőmérő), 0x51 (RTC óra), 0x55 (BQ27220 akkumulátor), 0x6A (IMU).
    scan: true
  - id: i2c_touch
    scl: GPIO2
    sda: GPIO3
    frequency: 100kHz

i2s_audio:
  i2s_lrclk_pin: GPIO19

# =============================================================================
#  MÉLY ALVÁS – az OK/FEL/LE gombra ébred, és sleep_duration időnként magától.
#  A GPIO45/46 a tápfeszültség-retesz: a go_to_sleep script alvás közben is
#  tartja őket, így a készülék alszik, nem kapcsol ki. Az OK hosszan nyomva
#  (kb. 5 mp) kikapcsolja, majd újra bekapcsolja.
# =============================================================================
deep_sleep:
  id: sleeper
  esp32_ext1_wakeup:
    pins:
      - number: GPIO4
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO5
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO6
        mode: INPUT_PULLUP
        allow_other_uses: true
    mode: ANY_LOW
  sleep_duration: ${sleep_duration}

output:
  - platform: gpio
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    id: pwr_hold
  - platform: gpio
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    id: pwr_lock
  - platform: gpio
    pin: GPIO38
    id: mic_power_enable
  # BQ25616 töltő engedélyezés, alacsony szinten aktív. BE = a láb alacsony = tölt.
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    id: charge_enable
  - platform: ledc
    pin: GPIO48
    id: buzzer_pwm
    frequency: 2700Hz

switch:
  # Az érintés tengelyeinek javítása, a Home Assistantból állítható.
  - platform: template
    id: flip_x
    name: "Érintés tükrözés X"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    id: flip_y
    name: "Érintés tükrözés Y"
    optimistic: true
    # Ezen a lapon az Y-t kell tükrözni, az X-et nem.
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: gpio
    pin: GPIO42
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100

light:
  # a csipogó (buzzer) PWM-mel, rövid visszajelző hangokhoz
  - platform: monochromatic
    output: buzzer_pwm
    id: buzzer
    internal: true
    default_transition_length: 0s

time:
  # a beépített RTC óra (alvás alatt is jár), a Home Assistant időre szinkronizálja
  - platform: pcf8563
    i2c_id: i2c_sensor
    id: rtc_time
    address: 0x51
    update_interval: never
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf8563.write_time:

# =============================================================================
#  ÁLLAPOT (globális változók)
#  ui_mode – melyik oldal látszik:
#    0 menü, 1 hallgat, 2 gondolkodik, 3 válasz (asszisztens), 5 TV távirányító,
#    6 lámpa oldal, 14 időjárás, 15 fűtés
# =============================================================================
globals:
  - id: ui_mode
    type: int
    restore_value: false
    initial_value: '0'
  # meddig maradjon ébren (ms) – gombos vagy időzített ébredés szerint
  - id: awake_ms
    type: int
    restore_value: false
    initial_value: '${awake_after_button_ms}'
  # melyik érintési zónára koppintottál (lásd a touchscreen részt)
  - id: hit_tile
    type: int
    restore_value: false
    initial_value: '-1'
  # az asszisztens: amit hallott, és amit válaszolt
  - id: last_heard
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: last_reply
    type: std::string
    restore_value: false
    initial_value: '""'
  # Csak az elalvás előtti utolsó rajzolásnál igaz – ilyenkor kerül a hold a fejlécbe.
  - id: sleeping
    type: bool
    restore_value: false
    initial_value: 'false'
  # Melyik lámpa oldal látszik: 0 = 1. csempe, 1 = 2. csempe, 2 = 3. csempe.
  - id: light_page
    type: int
    restore_value: false
    initial_value: '0'
  # Az utolsó érintés X koordinátája (a tükrözés után) – a lámpa sávokhoz kell.
  - id: touch_x
    type: int
    restore_value: false
    initial_value: '0'
  # fűtés: a helyben választott célhőmérséklet, amíg küldés alatt van (NAN = a Home Assistantét követi)
  - id: heat_set
    type: float
    restore_value: false
    initial_value: 'NAN'
  # a gombkezelők ide jegyzik fel, melyik oldalon nyomták meg a gombot
  - id: btn_mode
    type: int
    restore_value: false
    initial_value: '0'

# Betűtípusok – mindegyikhez hozzáadva a magyar ékezetes betűk és a fok jel.
font:
  - file: "gfonts://Inter@700"
    id: f_tile
    size: 27
    glyphsets: [GF_Latin_Kernel]
    glyphs: "áéíóöőúüűÁÉÍÓÖŐÚÜŰ°"

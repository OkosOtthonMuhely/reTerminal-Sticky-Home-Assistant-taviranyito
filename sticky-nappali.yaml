    size: 31
    glyphsets: [GF_Latin_Kernel]
    glyphs: "áéíóöőúüűÁÉÍÓÖŐÚÜŰ°"
  # nagy számok a fűtés oldalon (csak a szükséges karakterekkel – így kevesebb helyet foglal)
  - file: "gfonts://Inter@800"

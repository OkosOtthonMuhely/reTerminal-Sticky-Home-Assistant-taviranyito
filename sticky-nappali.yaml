        // ---- gyors beállítások ----
        const char *pl[3] = {"${heat_preset1_label}", "${heat_preset2_label}", "${heat_preset3_label}"};
        const float pv[3] = {(float) atof("${heat_preset1}"), (float) atof("${heat_preset2}"), (float) atof("${heat_preset3}")};
        for (int i = 0; i < 3; i++) {
          int x = 12 + i * 156;
          bool on = !isnan(tgt) && fabsf(tgt - pv[i]) < 0.05f;
          if (on) it.filled_rectangle(x, 400, 144, 72, INK);
          else    thick_box(x, 400, 144, 72, 3);
          it.print(x + 72, 408, id(f_state), on ? PAPER : INK, TextAlign::TOP_CENTER, pl[i]);
          snprintf(b, sizeof(b), "%.0f°", pv[i]);
          it.print(x + 72, 440, id(f_small), on ? PAPER : INK, TextAlign::TOP_CENTER, b);
        }
        // ---- grafikon: az utolsó 24 óra (10 percenként egy pont, „h” = akkor fűtött) ----
        {
          std::vector<float> v;
          std::vector<bool> hh;
          std::string src = id(heat_hist).state;
          size_t a2 = 0;
          while (a2 < src.size()) {
            size_t e = src.find(',', a2);
            if (e == std::string::npos) e = src.size();
            std::string p = src.substr(a2, e - a2);
            if (!p.empty() && ((p[0] >= '0' && p[0] <= '9') || p[0] == '-')) {
              hh.push_back(p.back() == 'h');
              v.push_back(atof(p.c_str()) / 10.0f);
            }
            a2 = e + 1;
          }
          const int cx0 = 46, cx1 = 460, cy0 = 524, cy1 = 694, N = 144;
          it.print(14, 490, id(f_state), INK, TextAlign::TOP_LEFT, "Elmúlt 24 óra");
          if (v.size() < 2) {
            it.print(W / 2, 590, id(f_small), INK, TextAlign::TOP_CENTER, "Az előzmény a Home Assistantból jön,");
            it.print(W / 2, 616, id(f_small), INK, TextAlign::TOP_CENTER, "10 percenként gyűlik.");
          } else {
            float mn = v[0], mx = v[0];
            for (float x : v) { mn = std::min(mn, x); mx = std::max(mx, x); }
            snprintf(b, sizeof(b), "min %.1f°  max %.1f°", mn, mx); comma(b);
            it.print(466, 494, id(f_small), INK, TextAlign::TOP_RIGHT, b);
            // skála: egész fokok az adatok (és a cél) körül, legalább 3 fok magas
            float lo = floorf(std::min(mn, isnan(tgt) ? mn : tgt) - 0.5f);
            float hi = ceilf(std::max(mx, isnan(tgt) ? mx : tgt) + 0.5f);
            if (hi - lo < 3) hi = lo + 3;
            int step = (hi - lo) > 6 ? 2 : 1;
            auto Y = [&](float t) { return cy1 - (int) ((t - lo) / (hi - lo) * (cy1 - cy0)); };
            // pontozott rácsvonalak feliratokkal
            for (int g = (int) ceilf(lo); g <= (int) hi; g += step) {
              int y = Y(g);
              if (y <= cy0 - 2 || y >= cy1) continue;
              for (int x = cx0; x < cx1; x += 10) it.horizontal_line(x, y, 4, INK);
              snprintf(b, sizeof(b), "%d°", g);
              it.print(cx0 - 6, y - 9, id(f_small), INK, TextAlign::TOP_RIGHT, b);
            }
            it.horizontal_line(cx0, cy1, cx1 - cx0, INK);

        // ---- nagy hőmérséklet ----
        if (!isnan(cur)) { snprintf(b, sizeof(b), "%.1f°", cur); comma(b); } else snprintf(b, sizeof(b), "-");
        it.print(W / 2, 62, id(f_big), INK, TextAlign::TOP_CENTER, b);
        // ---- cél:  -  [érték]  + ----

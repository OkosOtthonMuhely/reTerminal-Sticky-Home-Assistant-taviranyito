            if (!isnan(tgt)) {
              int y = Y(tgt);
              for (int x = cx0; x < cx1; x += 16) it.filled_rectangle(x, y - 1, 9, 3, INK);
            }
            // hőmérséklet vonal (3 px vastag); a pontok a jobb szélhez (= most) igazodnak
            int n = v.size();
            auto X = [&](int i) { return cx1 - (int) ((float) (n - 1 - i) * (cx1 - cx0) / (N - 1)); };
            for (int i = 1; i < n; i++) {
              int x0 = X(i - 1), y0 = Y(v[i - 1]), x1 = X(i), y1 = Y(v[i]);
              for (int o = -1; o <= 1; o++) it.line(x0, y0 + o, x1, y1 + o, INK);

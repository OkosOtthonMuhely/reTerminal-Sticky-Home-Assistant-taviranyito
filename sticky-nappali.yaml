script:
  # EGYETLEN út a képernyőre. Sorba áll, és a végén vár, amíg a (több másodperces)
  # frissítés tényleg befejeződik – így két rajzolás sosem akad össze.
  - id: redraw
    mode: queued
    max_runs: 2
    then:
      # Rövid várakozás: összevonja a gyorsan egymás után érkező változásokat,
      # de az oldalváltás még azonnalinak tűnik.
      - delay: 200ms
      - logger.log:
          level: WARN
          format: "RAJZOLÁS  oldal=%d c1=%d c2=%d c3=%d c4=%d"
          args:
            - id(ui_mode)
            - id(st_tile1).state
            - id(st_tile2).state
            - id(st_tile3).state
            - id(st_tile4).state
      - component.update: eink
      # A sor tartása, amíg a panel végez. Egy teljes frissítés kb. 1–2 mp.
      # Ha a naplóban „Display already in state ...” hiba jelenik meg, emeld 4s-ra.
      - delay: 3s

  # Az asszisztens indítása. A „figyelek” képernyőt a mikrofon bekapcsolása ELŐTT
  # rajzolja ki, hogy a frissítés ne akassza meg a hangfelvételt.
  - id: start_voice
    mode: single
    then:
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 1800Hz
      - light.turn_on:
          id: buzzer
          brightness: 45%
      - delay: 35ms
      - light.turn_off: buzzer
      - script.stop: redraw
      - lambda: |-
          id(ui_mode) = 1;
          id(last_heard) = "";
          id(last_reply) = "";
      - component.update: eink
      - delay: 250ms
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 3200Hz
      - light.turn_on:
          id: buzzer
          brightness: 70%
      - delay: 55ms
      - light.turn_off: buzzer
      - delay: 55ms
      - light.turn_on:
          id: buzzer
          brightness: 70%
      - delay: 55ms
      - light.turn_off: buzzer
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 2700Hz
      - delay: 150ms
      - voice_assistant.start:

  - id: open_remote
    mode: single
    then:
      - script.execute: beep
      - lambda: 'id(ui_mode) = 5;'
      - script.execute: redraw

  # Hosszú nyomás egy csempén: ha az ujj 600 ms után is lent van, megnyílik a csempe
  # részletes oldala. Rövid érintésnél az on_release még előtte leállítja.
  - id: long_press
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            lambda: 'return id(hit_tile) >= 0 && id(hit_tile) <= 2;'
          then:
            - script.execute:
                id: open_light
                page: !lambda 'return id(hit_tile);'
          else:
            - script.execute: open_remote

  # Egy lámpa oldal megnyitása. Körbeér: -1 → 2, 3 → 0.
  - id: open_light
    mode: restart
    parameters:
      page: int
    then:
      - script.execute: beep
      - lambda: |-
          id(light_page) = ((page % 3) + 3) % 3;
          id(ui_mode) = 6;
      - script.execute: redraw

  # Fényerő (kind 0) vagy színhőmérséklet (kind 1) beállítása aszerint, hol érintetted
  # meg a sávot. Bal szél = halvány / meleg, jobb szél = fényes / hideg.
  # Itt nincs újrarajzolás: a Home Assistantból érkező új állapot frissíti az oldalt.
  - id: light_set
    mode: queued
    max_runs: 3
    parameters:
      kind: int
    then:
      - script.execute: beep
      - if:
          condition:
            lambda: 'return kind == 0;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda |-
                    int p = id(light_page);
                    return std::string(p == 0 ? "${tile1_entity}" : p == 1 ? "${tile2_entity}" : "${tile3_entity}");
                  brightness_pct: !lambda |-
                    float f = (id(touch_x) - 15) / 450.0f;
                    if (f < 0) f = 0;
                    if (f > 1) f = 1;
                    int pct = (int) roundf(f * 100.0f);
                    if (pct < 1) pct = 1;
                    return std::to_string(pct);
      - if:
          condition:
            lambda: |-
              if (kind != 1) return false;
              int p = id(light_page);
              float mn = p == 0 ? id(l1_ctmin).state : p == 1 ? id(l2_ctmin).state : id(l3_ctmin).state;
              float mx = p == 0 ? id(l1_ctmax).state : p == 1 ? id(l2_ctmax).state : id(l3_ctmax).state;
              return !isnan(mn) && !isnan(mx) && mx > mn;
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda |-
                    int p = id(light_page);
                    return std::string(p == 0 ? "${tile1_entity}" : p == 1 ? "${tile2_entity}" : "${tile3_entity}");
                  color_temp_kelvin: !lambda |-
                    int p = id(light_page);
                    float mn = p == 0 ? id(l1_ctmin).state : p == 1 ? id(l2_ctmin).state : id(l3_ctmin).state;
                    float mx = p == 0 ? id(l1_ctmax).state : p == 1 ? id(l2_ctmax).state : id(l3_ctmax).state;
                    float f = (id(touch_x) - 15) / 450.0f;
                    if (f < 0) f = 0;
                    if (f > 1) f = 1;
                    return std::to_string((int) roundf(mn + f * (mx - mn)));

  # TV távirányító műveletek. Sorba áll, hogy a gyors hangerő-nyomások se vesszenek el.
  # Itt nincs újrarajzolás: a hangerőnek nincs mit mutatnia, a BE/KI és az EXTRA
  # pedig magától frissül, amikor a Home Assistant jelzi az új állapotot.
  - id: tv_action
    mode: queued
    max_runs: 5
    parameters:
      idx: int
    then:
      - script.execute: beep
      - if:
          condition:
            lambda: 'return idx == 10;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: ${tv_power_entity}
      - if:
          condition:
            lambda: 'return idx == 11;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: ${tv_extra_entity}
      - if:
          condition:
            lambda: 'return idx == 16;'
          then:
            - homeassistant.action:
                action: media_player.select_source
                data:
                  entity_id: ${tv_media_player}
                  source: "${tv_src1_source}"
      - if:
          condition:
            lambda: 'return idx == 12;'
          then:
            - homeassistant.action:
                action: media_player.select_source
                data:
                  entity_id: ${tv_media_player}
                  source: "${tv_src2_source}"
      - if:
          condition:
            lambda: 'return idx == 13;'
          then:
            - homeassistant.action:
                action: media_player.select_source
                data:
                  entity_id: ${tv_media_player}
                  source: "${tv_src3_source}"
      - if:
          condition:
            lambda: 'return idx == 14;'
          then:
            - homeassistant.action:
                action: media_player.volume_down
                data:
                  entity_id: ${tv_media_player}
      - if:
          condition:
            lambda: 'return idx == 15;'
          then:
            - homeassistant.action:
                action: media_player.volume_up
                data:
                  entity_id: ${tv_media_player}

  # ---------------------------------------------------------------------------
  #  Fizikai gombok
  # ---------------------------------------------------------------------------
  # OK rövid nyomás: a menüben az asszisztens, minden más oldalon vissza a menübe.
  - id: btn_ok_short
    mode: single
    then:
      - lambda: 'id(btn_mode) = id(ui_mode);'
      - if:
          condition:
            lambda: 'return id(btn_mode) == 0;'
          then:
            - script.execute: start_voice
      - if:
          condition:
            lambda: 'int m = id(btn_mode); return m == 3 || m == 5 || m == 6 || m == 14 || m == 15;'
          then:
            - script.execute: go_back
      - if:
          condition:
            lambda: 'return id(btn_mode) == 1 || id(btn_mode) == 2;'
          then:
            - script.execute: beep

  # FEL (dir -1) / LE (dir +1), oldalanként.
  - id: btn_updown
    mode: queued
    max_runs: 3
    parameters:
      dir: int
    then:
      - lambda: 'id(btn_mode) = id(ui_mode);'
      # TV távirányító: hangerő
      - if:
          condition:
            lambda: 'return id(btn_mode) == 5;'
          then:
            - script.execute:
                id: tv_action
                idx: !lambda 'return dir < 0 ? 15 : 14;'
      # időjárás oldal: vissza a menübe
      - if:
          condition:
            lambda: 'return id(btn_mode) == 14;'
          then:
            - script.execute: go_back
      # fűtés: FEL = melegebb, LE = hűvösebb (0,5 fok)
      - if:
          condition:
            lambda: 'return id(btn_mode) == 15;'
          then:
            - script.execute:
                id: heat_touch
                t: !lambda 'return dir < 0 ? 111 : 110;'
      # menü / lámpa oldalak: lapozás a lámpák között
      - if:
          condition:
            lambda: 'return id(btn_mode) == 0 || id(btn_mode) == 6;'
          then:
            - script.execute:
                id: open_light
                page: !lambda 'return id(btn_mode) == 0 ? (dir < 0 ? 2 : 0) : id(light_page) + dir;'
      # asszisztens oldalak: csak frissít
      - if:
          condition:
            lambda: 'int m = id(btn_mode); return m == 1 || m == 2 || m == 3;'
          then:
            - script.execute: beep
            - script.execute: redraw

  # ---------------------------------------------------------------------------
  #  Alvás
  # ---------------------------------------------------------------------------
  # Az ébren töltött idő számlálója: minden érintés / gombnyomás újraindítja.
  - id: idle_timer
    mode: restart
    then:
      - logger.log:
          level: WARN
          format: "alvás időzítő: %d ms"
          args: ['id(awake_ms)']
      - delay: !lambda 'return id(awake_ms);'
      - logger.log:
          level: WARN
          format: "lejárt az idő – elalvás"
      - script.execute: go_to_sleep

  - id: go_to_sleep
    mode: single
    then:
      - if:
          condition:
            lambda: 'return std::string("${low_power}") != "true";'
          then:
            - logger.log:
                level: WARN
                format: "NEM alszik – a low_power ki van kapcsolva"
          else:
            # Elalvás előtt mindig az időjárás képernyő (vagy, ha nincs adat, a menü)
            # kerül ki a holddal. Megvárja, amíg a frissítés véget ér, és csak utána alszik el.
            - lambda: |-
                id(sleeping) = true;
                std::string w = id(st_weather).state;
                id(ui_mode) = (!w.empty() && w != "unknown" && w != "unavailable") ? 14 : 0;
            - script.stop: redraw
            - component.update: eink
            - logger.log:
                level: WARN
                format: "a kijelzőre vár az elalvás előtt"
            - delay: 10s
            - output.turn_off: mic_power_enable
            - switch.turn_off: touch_power_enable
            - logger.log:
                level: WARN
                format: "alszik"
            - delay: 200ms
            # A tápfeszültség-retesz (GPIO45/46) tartása a mély alvás alatt.
            - lambda: |-
                gpio_hold_en((gpio_num_t) 45);
                gpio_hold_en((gpio_num_t) 46);
                gpio_deep_sleep_hold_en();
            - deep_sleep.allow: sleeper
            - deep_sleep.enter: sleeper

  # Rövid visszajelző csippanás érintésre / gombnyomásra.
  - id: beep
    mode: restart
    then:
      - light.turn_on:
          id: buzzer
          brightness: 60%
      - delay: 40ms
      - light.turn_off: buzzer

  # ---------------------------------------------------------------------------
  #  Fűtés
  # ---------------------------------------------------------------------------
  # 110 / 111: -0,5 / +0,5 fok   112–114: ki / fűtés / auto   115–117: gyors beállítások
  - id: heat_touch
    mode: queued
    max_runs: 4
    parameters:
      t: int
    then:
      - script.execute: beep
      - if:
          condition:
            lambda: 'return t >= 112 && t <= 114;'
          then:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${heat_entity}
                  hvac_mode: !lambda 'return std::string(t == 112 ? "off" : t == 113 ? "heat" : "auto");'
          else:
            - lambda: |-
                float base = !isnan(id(heat_set)) ? id(heat_set) : id(heat_target).state;
                if (isnan(base)) base = 21.0f;
                float v = base;
                if (t == 110) v = base - 0.5f;
                else if (t == 111) v = base + 0.5f;
                else if (t == 115) v = atof("${heat_preset1}");
                else if (t == 116) v = atof("${heat_preset2}");
                else if (t == 117) v = atof("${heat_preset3}");
                v = roundf(v * 2.0f) / 2.0f;
                if (v < 5.0f) v = 5.0f;
                if (v > 30.0f) v = 30.0f;
                id(heat_set) = v;
            - script.execute: redraw
            - script.execute: heat_send

  # az utolsó nyomás után 1,5 mp-cel küldi el a célt (több nyomásból így egy változás lesz)
  - id: heat_send
    mode: restart
    then:
      - delay: 1500ms
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${heat_entity}
            temperature: !lambda |-
              char b[8];
              snprintf(b, sizeof(b), "%.1f", id(heat_set));
              return std::string(b);
      # kicsivel később a Home Assistant visszajelzi az új célt; onnantól újra azt követi
      - delay: 4s
      - lambda: 'id(heat_set) = NAN;'

  - id: go_back
    mode: single
    then:
      - script.execute: beep
      - script.stop: back_to_menu
      - lambda: |-
          id(ui_mode) = 0;
          id(last_heard) = "";
          id(last_reply) = "";
      - script.execute: redraw

  # Biztonsági háló: ne maradjon kint örökre egy régi asszisztens-válasz.
  - id: back_to_menu
    mode: restart
    then:
      - delay: 3min
      - lambda: |-
          id(ui_mode) = 0;
          id(last_heard) = "";
          id(last_reply) = "";
      - script.execute: redraw

  # a homeassistant.toggle bármilyen be/ki kapcsolható entitással működik: light, switch, input_boolean...
  - id: do_toggle
    mode: single
    parameters:
      idx: int
    then:
      - script.execute: beep
      - if:
          condition:
            lambda: 'return idx == 0;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: ${tile1_entity}
      - if:
          condition:
            lambda: 'return idx == 1;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: ${tile2_entity}
      - if:
          condition:
            lambda: 'return idx == 2;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: ${tile3_entity}
      - if:
          condition:
            lambda: 'return idx == 3;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: ${tile4_entity}

# =============================================================================
#  KIJELZŐ – minden oldal rajzolása egy helyen. A koordináták a 480×800-as
#  álló képernyőre vonatkoznak; a koppintási zónák a touchscreen részben vannak.
# =============================================================================
display:
  - platform: epaper_spi
    id: eink
    model: seeed-reterminal-sticky
    rotation: 90
    # Mindig teljes frissítés; a rajzolást kizárólag a redraw script indítja.
    update_interval: never
    lambda: |-
      // Ezen a panelen a COLOR_OFF a TINTA (fekete), a COLOR_ON a PAPÍR (világos).
      const Color INK   = COLOR_OFF;
      const Color PAPER = COLOR_ON;
      const int W = 480;
      const int H = 800;
      // keretes doboz t pixel vastag szegéllyel
      auto thick_box = [&](int x, int y, int w, int h, int t) {
        for (int i = 0; i < t; i++) it.rectangle(x + i, y + i, w - 2*i, h - 2*i, INK);
      };
      // Szöveg tördelése legfeljebb maxc karakteres sorokra, szóközöknél.
      auto wrap = [](std::string s, size_t maxc) {
        std::vector<std::string> out;
        while (!s.empty() && out.size() < 10) {
          size_t cut = s.size();
          if (s.size() > maxc) {
            size_t sp = s.rfind(' ', maxc);
            cut = (sp == std::string::npos || sp == 0) ? maxc : sp;
          }
          out.push_back(s.substr(0, cut));
          s = (cut < s.size()) ? s.substr(cut) : std::string("");
          while (!s.empty() && s[0] == ' ') s.erase(0, 1);
        }
        return out;
      };
      // ======================= FEJLÉC =======================
      // Óra nincs benne: 4 órás ébredési ciklus mellett elavult időt mutatna.
      // Bal felül az oldal címe (a menüben az eszköz neve).
      if (id(ui_mode) == 0) {
        it.print(14, 10, id(f_body), INK, TextAlign::TOP_LEFT, "${friendly_name}");
      } else if (id(ui_mode) == 5) {
        it.print(14, 10, id(f_body), INK, TextAlign::TOP_LEFT, "TV");
      } else if (id(ui_mode) == 15) {
        it.print(14, 10, id(f_body), INK, TextAlign::TOP_LEFT, "${heat_label}");
      } else if (id(ui_mode) == 14) {
        // időjárás: a mai dátum (az RTC órából)
        auto tn = id(rtc_time).now();
        if (tn.is_valid()) {
          static const char *DAYS[] = {"", "Vasárnap", "Hétfő", "Kedd", "Szerda", "Csütörtök", "Péntek", "Szombat"};
          static const char *MONTHS[] = {"", "jan.", "febr.", "márc.", "ápr.", "máj.", "jún.",
                                         "júl.", "aug.", "szept.", "okt.", "nov.", "dec."};
          it.printf(14, 10, id(f_body), INK, TextAlign::TOP_LEFT, "%s, %s %d.",
                    DAYS[tn.day_of_week], MONTHS[tn.month], tn.day_of_month);
        }
      }
      // ---- akkumulátor jelző ----
      {
        const int bx = W - 62, by = 13, bw = 44, bh = 22;
        it.rectangle(bx, by, bw, bh, INK);
        it.filled_rectangle(bx + bw, by + 7, 4, 8, INK);
        float pct = id(battery_level).state;
        if (!isnan(pct)) {
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          int fill = (int) ((bw - 6) * pct / 100.0f);
          if (fill > 0) it.filled_rectangle(bx + 3, by + 3, fill, bh - 6, INK);
          it.printf(bx - 8, 10, id(f_body), INK, TextAlign::TOP_RIGHT, "%.0f%%", pct);
        } else {
          it.print(bx - 8, 10, id(f_body), INK, TextAlign::TOP_RIGHT, "--");
        }
        // töltés jel (villám)
        if (!isnan(id(battery_current).state) && id(battery_current).state > 20.0f) {
          int cx = bx - 78, cy = 13;
          it.line(cx + 8, cy,      cx + 2, cy + 11, INK);
          it.line(cx + 2, cy + 11, cx + 9, cy + 11, INK);
          it.line(cx + 9, cy + 11, cx + 3, cy + 22, INK);
        }
      }
      // ---- alvás jelzés: hold a fejléc közepén ----
      if (id(sleeping)) {
        // az időjárás oldalon a dátum hosszú, ezért ott a hold az akkumulátor elé kerül
        it.image(id(ui_mode) == 14 ? 300 : W / 2 - 14, 10, id(ic_sleep), INK, PAPER);
      }
      it.filled_rectangle(14, 48, W - 28, 2, INK);
      // ======================== MENÜ ========================
      if (id(ui_mode) == 0) {
        const int TW = 222, TH = 180;
        const int tx[4] = { 12, 246,  12, 246};
        const int ty[4] = { 64,  64, 256, 256};
        const char* names[4] = {"${tile1_label}", "${tile2_label}",
                                "${tile3_label}", "${tile4_label}"};
        bool on[4];
        on[0] = id(st_tile1).state;
        on[1] = id(st_tile2).state;
        on[2] = id(st_tile3).state;
        on[3] = id(st_tile4).state;
        const char* states[4];
        for (int i = 0; i < 4; i++) states[i] = on[i] ? "BE" : "KI";
        for (int i = 0; i < 4; i++) {
          int x = tx[i], y = ty[i];
          bool inv = on[i];
          // BE = tele fekete csempe, világos tartalommal
          // KI = világos csempe 3 px-es fekete kerettel, fekete tartalommal
          Color fg = inv ? PAPER : INK;
          Color bg = inv ? INK   : PAPER;
          if (inv) {
            it.filled_rectangle(x, y, TW, TH, INK);
          } else {
            thick_box(x, y, TW, TH, 3);
          }
          int ix = x + (TW - 96) / 2;
          switch (i) {
            case 0: it.image(ix, y + 10, id(ic_tile1), fg, bg); break;
            case 1: it.image(ix, y + 10, id(ic_tile2), fg, bg); break;
            case 2: it.image(ix, y + 10, id(ic_tile3), fg, bg); break;
            case 3: it.image(ix, y + 10, id(ic_tile4), fg, bg); break;
          }
          it.printf(x + TW/2, y + 110, id(f_tile), fg, TextAlign::TOP_CENTER,
                    "%s", names[i]);
          it.printf(x + TW/2, y + 146, id(f_state), fg, TextAlign::TOP_CENTER,
                    "%s", states[i]);
        }
        // ---- fűtés sáv: középre igazítva, fűtés közben sötét ----
        {
          float room = id(heat_cur).state;
          float tgt = !isnan(id(heat_set)) ? id(heat_set) : id(heat_target).state;
          std::string mode = id(heat_mode).state;
          bool heating = id(heat_action).state == "heating";
          char b1[40], b2[64];
          if (isnan(room)) snprintf(b1, sizeof(b1), "${heat_label}");
          else snprintf(b1, sizeof(b1), "${heat_label}   %.1f°", room);
          if (mode == "off") snprintf(b2, sizeof(b2), "kikapcsolva");
          else if (isnan(tgt)) snprintf(b2, sizeof(b2), "nincs adat");
          else snprintf(b2, sizeof(b2), "cél %.1f°   %s", tgt, heating ? "most fűt" : "nem fűt");
          for (char *q = b1; *q; q++) if (*q == '.') *q = ',';
          for (char *q = b2; *q; q++) if (*q == '.') *q = ',';
          Color fg = heating ? PAPER : INK, bg = heating ? INK : PAPER;
          if (heating) it.filled_rectangle(12, 448, 456, 80, INK);
          else         thick_box(12, 448, 456, 80, 3);
          // az ikon és a két sor egy csoportként, a sáv közepén
          int bx, by, w1, h1, w2, h2;
          it.get_text_bounds(0, 0, b1, id(f_tile), TextAlign::TOP_LEFT, &bx, &by, &w1, &h1);
          it.get_text_bounds(0, 0, b2, id(f_small), TextAlign::TOP_LEFT, &bx, &by, &w2, &h2);
          int gw = 56 + 16 + std::max(w1, w2);
          int gx = (W - gw) / 2;
          it.image(gx, 460, id(ic_heat), fg, bg);
          it.print(gx + 72, 458, id(f_tile), fg, TextAlign::TOP_LEFT, b1);
          it.print(gx + 72, 494, id(f_small), fg, TextAlign::TOP_LEFT, b2);
        }
        // ---- alsó sor: bal oldalt az asszisztens, jobb oldalt az időjárás ----
        thick_box(12, 542, 222, 180, 3);
        it.image(91, 566, id(ic_mic), INK, PAPER);
        it.print(123, 648, id(f_tile), INK, TextAlign::TOP_CENTER, "${voice_label}");
        thick_box(246, 542, 222, 180, 3);
        {
          // a mostani idő ikonja és hőmérséklete (a Home Assistantból), ha van adat
          std::string w = id(st_weather).state;
          std::string c = w.substr(0, w.find('|'));
          int temp = 0; bool have = false;
          size_t a = w.find('|');
          if (a != std::string::npos && !c.empty() && c != "unknown" && c != "unavailable") {
            temp = atoi(w.c_str() + a + 1); have = true;
          }
          esphome::image::Image *ic =
              c == "sunny" ? id(ws_sunny) : c == "clear-night" ? id(ws_night) : c == "partlycloudy" ? id(ws_partly) :
              c == "cloudy" ? id(ws_cloudy) : c == "fog" ? id(ws_fog) : c == "rainy" ? id(ws_rainy) :
              c == "pouring" ? id(ws_pouring) : (c == "lightning" || c == "lightning-rainy") ? id(ws_storm) :
              (c == "snowy" || c == "snowy-rainy" || c == "hail") ? id(ws_snowy) :
              (c == "windy" || c == "windy-variant") ? id(ws_windy) : id(ws_partly);
          if (have) {
            it.image(270, 560, ic, INK, PAPER);
            it.printf(450, 572, id(f_head), INK, TextAlign::TOP_RIGHT, "%d°", temp);
          } else {
            it.image(321, 560, ic, INK, PAPER);
          }
          it.print(357, 648, id(f_tile), INK, TextAlign::TOP_CENTER, "${weather_label}");
        }
        // ---- lábléc ----
        if (id(temp_sensor).has_state()) {
          it.printf(14, H - 16, id(f_small), INK, TextAlign::BASELINE_LEFT,
                    "%.1f °C", id(temp_sensor).state);
        }
        it.print(W - 14, H - 16, id(f_small), INK, TextAlign::BASELINE_RIGHT,
                 "${footer_text}");
